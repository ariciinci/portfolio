<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F2EFE9">
<title>Inci Arici — Creative Operations &amp; Production</title>
<meta name="description" content="Inci Arici — Creative Operations, Production &amp; Digital Transformation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* Warm Ash palette (kept)
     Charcoal #1A1917 · Bone #F2EFE9 · Sand #D8D0C0 · Smoke #9B968C · Burnt Umber #6B5B4A
     Layout language adapted from the KIKK Festival talk page: oversized bold titles,
     pill-shaped tags and nav, label + text sections, rounded imagery, dark footer band. */
  :root{
    --paper:#F2EFE9;
    --paper-alt:#E8E3D9;
    --ink:#1A1917;
    --ink-soft:#3D3A35;
    --ink-faint:#6F695F;
    --accent:#6B5B4A;
    --accent-soft:#1A1917;
    --line:#D8D0C0;
    --line-soft:#E2DCCE;
    --smoke:#9B968C;
    --max:1080px;
    --radius:16px;
    --pill:999px;
    --font:'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);}
  a:hover{color:var(--accent-soft);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 24px;}

  /* ---------- Header: pill navigation ---------- */
  header.site{position:sticky; top:0; z-index:50; background:var(--paper);}
  .navbar{
    max-width:var(--max); margin:0 auto; padding:18px 24px;
    display:flex; justify-content:space-between; align-items:center; gap:24px;
  }
  .navbar .name{
    font-size:17px; font-weight:700; letter-spacing:-0.02em;
    text-decoration:none; color:var(--ink); cursor:pointer;
  }
  .navbar .brand{display:flex; flex-direction:column; align-items:flex-start;}
  .navbar .brand .name{line-height:1.2;}
  .navbar .brand .tagline{color:var(--ink-faint); font-size:13px; margin-top:2px; line-height:1.3;}
  .navbar nav{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .navbar nav a{
    color:var(--ink); text-decoration:none; font-size:14px; font-weight:500; cursor:pointer;
    padding:8px 16px; border:1px solid var(--line); border-radius:var(--pill);
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .navbar nav a:hover{border-color:var(--ink);}
  .navbar nav a.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .navbar nav a[data-link="creative-intelligence"]:not(.active){color:var(--accent); border-color:var(--accent);}
  .navbar .nav-toggle{display:none;}
  @media (max-width:720px){
    .navbar nav{
      position:absolute; top:100%; left:0; right:0; background:var(--paper);
      border-bottom:1px solid var(--line); flex-direction:column; align-items:flex-start;
      padding:8px 24px 20px; gap:10px; display:none;
    }
    .navbar nav.open{display:flex;}
    .navbar .nav-toggle{
      display:block; background:none; border:1px solid var(--ink); border-radius:var(--pill);
      padding:8px 18px; font-size:14px; font-weight:500; color:var(--ink); cursor:pointer; font-family:var(--font);
    }
    .navbar .brand .tagline{font-size:12.5px;}
  }

  main#page-content{padding:64px 0 128px;}
  #loading{color:var(--ink-faint); padding:60px 0;}

  /* ---------- Hero (home): oversized, tightly set title ---------- */
  .page-hero .kicker{
    display:inline-block; margin-bottom:32px; padding:7px 16px;
    border:1px solid var(--ink); border-radius:var(--pill);
    color:var(--ink); font-size:14px; font-weight:500;
  }
  .page-hero h1{
    font-weight:700; font-size:clamp(44px,9.5vw,112px);
    max-width:13ch; letter-spacing:-0.05em; line-height:0.96; margin:0 0 44px;
  }
  .page-hero p{font-size:19px; color:var(--ink-soft); max-width:50ch; margin:0 0 14px; line-height:1.5;}
  .page-hero p a{text-decoration:none; border-bottom:1.5px solid var(--ink); padding-bottom:1px; margin-right:6px; color:var(--ink);}
  .page-hero p a:hover{border-bottom-color:var(--accent);}

  /* ---------- Prose: every other page ---------- */
  .prose h1{
    font-weight:700; font-size:clamp(38px,7vw,80px);
    letter-spacing:-0.045em; margin:0 0 56px; line-height:0.98; max-width:18ch;
  }
  .prose h2{
    font-size:26px; font-weight:600; letter-spacing:-0.025em;
    margin:64px 0 16px; padding-top:28px; border-top:1px solid var(--line);
  }
  .prose h2:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .prose h3{font-size:17px; font-weight:600; margin:32px 0 8px; letter-spacing:-0.015em;}
  .prose p{margin:0 0 16px; color:var(--ink-soft); max-width:66ch;}
  .prose strong{color:var(--ink); font-weight:600;}
  .prose ul, .prose ol{margin:0 0 18px; padding-left:22px; color:var(--ink-soft); max-width:64ch;}
  .prose li{margin-bottom:8px;}
  .prose em{color:var(--ink-faint);}
  .prose hr{border:none; border-top:1px solid var(--line); margin:48px 0;}
  .prose table{border-collapse:collapse; width:100%; margin:12px 0 28px;}
  .prose th, .prose td{text-align:left; padding:12px 16px 12px 0; border-top:1px solid var(--line); font-size:15px;}
  .prose th{color:var(--ink-faint); font-weight:400;}
  .prose td:first-child{color:var(--ink); font-weight:600;}
  .prose a{text-decoration:none; border-bottom:1.5px solid var(--smoke); padding-bottom:1px;}
  .prose a:hover{border-bottom-color:var(--ink);}

  /* Label + text sections (frontmatter "layout: sections") */
  .prose .sec-row{
    display:grid; grid-template-columns:200px minmax(0,1fr); gap:8px 40px;
    padding:32px 0; border-top:1px solid var(--ink);
  }
  .prose .sec-row h2{
    font-size:15px; font-weight:600; letter-spacing:-0.005em;
    color:var(--ink); margin:0; padding:3px 0 0; border:none;
  }
  .prose .sec-body > :first-child{margin-top:0;}
  .prose .sec-body > :last-child{margin-bottom:0;}
  .prose .sec-body p{max-width:64ch;}
  @media (max-width:720px){
    .prose .sec-row{grid-template-columns:1fr; gap:10px;}
  }

  /* ---------- Images: rounded, like the talk gallery ---------- */
  .prose img{
    max-width:100%; height:auto; display:block;
    margin:32px 0; border:none; border-radius:var(--radius);
  }
  .prose img.img-small{max-width:320px;}
  .prose img.img-medium{max-width:520px;}
  .prose img.img-full{max-width:100%;}
  .prose img.img-center{margin-left:auto; margin-right:auto;}
  .prose figure{margin:32px 0;}
  .prose figure img{margin:0 0 12px;}
  .prose figcaption{font-size:14px; color:var(--ink-faint);}

  /* ---------- Footer: dark band ---------- */
  footer.site-footer{
    padding:56px 0 64px; background:var(--ink); color:var(--paper);
  }
  footer.site-footer .fine{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px 32px;
    font-size:15px; color:var(--smoke);
  }
  footer.site-footer .fine strong{display:block; color:var(--paper); font-size:clamp(28px,5vw,48px); font-weight:700; letter-spacing:-0.04em; line-height:1;}
  footer.site-footer a{color:var(--paper); text-decoration:none; border-bottom:1px solid var(--smoke); font-size:18px;}
  footer.site-footer a:hover{border-bottom-color:var(--paper);}

  /* Back-to-index button (pages that opt in) */
  #case-index-back-btn{
    background:var(--ink) !important; color:var(--paper) !important;
    border-radius:var(--pill) !important; font-size:14px !important; font-weight:500 !important;
    padding:10px 18px !important; box-shadow:none !important;
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <div class="brand">
      <a class="name" data-link="home">Inci Arici</a>
      <div class="tagline">Creative Operations · Production · Digital Transformation</div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">Menu</button>
    <nav id="navLinks"><!-- populated from manifest.json --></nav>
  </div>
</header>

<main id="page-content" class="wrap">
  <div id="loading">Loading…</div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="fine">
      <div><strong>Inci Arici</strong>Amsterdam</div>
      <a href="mailto:incinema@gmail.com">incinema@gmail.com</a>
    </div>
  </div>
</footer>

<a id="case-index-back-btn" href="javascript:void(0)" onclick="window.scrollTo({top:0, behavior:'smooth'})"
   style="position:fixed; bottom:24px; z-index:999; background:#1A1917; color:#F2EFE9; padding:10px 18px; border-radius:999px; font-size:13px; text-decoration:none; font-family:inherit; display:none;">
  ↑ Index
</a>

<script>
(function(){
  var content = document.getElementById('page-content');
  var navLinks = document.getElementById('navLinks');
  var manifest = [];

  // Sticky "↑ Index" button visibility is driven by a per-page frontmatter flag
  // (indexButton: true) rather than any page-specific element ID, so any case
  // study page — Calvin Klein, Reebok, or future ones — can opt in the same way.
  function alignIndexButton(){
    var btn = document.getElementById('case-index-back-btn');
    if(content.dataset.hasIndex !== '1'){
      btn.style.display = 'none';
      return;
    }
    var paragraphs = content.querySelectorAll('.prose p');
    if(!paragraphs.length){
      btn.style.display = 'none';
      return;
    }
    var rightEdge = 0;
    paragraphs.forEach(function(p){
      var r = p.getBoundingClientRect();
      if(r.width > 0 && r.right > rightEdge) rightEdge = r.right;
    });
    var rightGap = window.innerWidth - rightEdge;
    btn.style.right = Math.max(rightGap, 12) + 'px';
    btn.style.display = 'block';
  }
  window.addEventListener('resize', alignIndexButton);

  // --- tiny frontmatter parser: pulls a --- ... --- block off the top of a markdown file ---
  function parseFrontmatter(raw){
    var meta = {};
    var body = raw;
    var match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    if(match){
      body = raw.slice(match[0].length);
      match[1].split('\n').forEach(function(line){
        var idx = line.indexOf(':');
        if(idx > -1){
          var key = line.slice(0, idx).trim();
          var val = line.slice(idx + 1).trim();
          meta[key] = val;
        }
      });
    }
    return { meta: meta, body: body };
  }

  // "Label and text" layout: wraps each <h2> and the content that follows it
  // into a two-column row. Anything before the first <h2> (like the <h1>) is left alone.
  function buildSections(prose){
    if(!prose) return;
    var kids = Array.prototype.slice.call(prose.children);
    var frag = document.createDocumentFragment();
    var body = null;
    kids.forEach(function(el){
      if(el.tagName === 'H2'){
        var row = document.createElement('div');
        row.className = 'sec-row';
        body = document.createElement('div');
        body.className = 'sec-body';
        row.appendChild(el);
        row.appendChild(body);
        frag.appendChild(row);
      } else if(body){
        body.appendChild(el);
      } else {
        frag.appendChild(el);
      }
    });
    prose.innerHTML = '';
    prose.appendChild(frag);
  }

  function setActiveNav(slug){
    navLinks.querySelectorAll('a').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-link') === slug);
    });
  }

  function renderPage(slug){
    var entry = manifest.find(function(p){ return p.slug === slug; });
    if(!entry){
      content.innerHTML = '<div class="prose"><h1>Page not found</h1><p>That page doesn\'t exist yet.</p></div>';
      content.dataset.hasIndex = '0';
      alignIndexButton();
      return;
    }
    content.innerHTML = '<div id="loading">Loading…</div>';
    content.dataset.hasIndex = '0';
    alignIndexButton();
    fetch('pages/' + entry.file, {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('Could not load ' + entry.file);
        return r.text();
      })
      .then(function(raw){
        var parsed = parseFrontmatter(raw);
        var html = marked.parse(parsed.body);
        var isHero = parsed.meta.layout === 'hero';
        var wrapClass = isHero ? 'page-hero' : 'prose';
        var kickerHtml = (isHero && parsed.meta.kicker) ? '<div class="kicker">' + parsed.meta.kicker + '</div>' : '';
        content.innerHTML = '<div class="' + wrapClass + '">' + kickerHtml + html + '</div>';
        if(parsed.meta.layout === 'sections'){
          buildSections(content.querySelector('.prose'));
        }
        content.dataset.hasIndex = (parsed.meta.indexButton === 'true') ? '1' : '0';
        document.title = (parsed.meta.title || entry.label) + ' — Inci Arici';
        setActiveNav(slug);
        window.scrollTo(0, 0);
        setTimeout(alignIndexButton, 100);
      })
      .catch(function(err){
        content.innerHTML = '<div class="prose"><h1>Something went wrong</h1><p>' + err.message + '</p></div>';
        content.dataset.hasIndex = '0';
        alignIndexButton();
      });
  }

  function currentSlug(){
    var hash = window.location.hash.replace(/^#\/?/, '');
    return hash || 'home';
  }

  function buildNav(){
    navLinks.innerHTML = '';
    manifest.filter(function(p){ return p.nav; }).forEach(function(p){
      var a = document.createElement('a');
      a.textContent = p.label;
      a.setAttribute('data-link', p.slug);
      a.href = '#/' + p.slug;
      navLinks.appendChild(a);
    });
  }

  window.addEventListener('hashchange', function(){ renderPage(currentSlug()); });

  document.querySelector('.name').addEventListener('click', function(){
    window.location.hash = '#/home';
  });

  var navToggle = document.getElementById('navToggle');
  navToggle.addEventListener('click', function(){ navLinks.classList.toggle('open'); });
  navLinks.addEventListener('click', function(e){
    if(e.target.tagName === 'A') navLinks.classList.remove('open');
  });

  fetch('pages/manifest.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      manifest = data;
      buildNav();
      renderPage(currentSlug());
    })
    .catch(function(err){
      content.innerHTML = '<div class="prose"><h1>Could not load site content</h1><p>' + err.message + '</p></div>';
    });
})();
</script>

</body>
</html>
