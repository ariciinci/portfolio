<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inci Arici — Creative Operations &amp; Production</title>
<meta name="description" content="Inci Arici — Creative Operations, Production &amp; Digital Transformation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* Warm Ash palette
     Charcoal #1A1917 · Bone #F2EFE9 · Sand #D8D0C0 · Smoke #9B968C · Burnt Umber #6B5B4A */
  :root{
    --paper:#F2EFE9;        /* Bone: main background */
    --paper-alt:#D8D0C0;    /* Sand: footer, section backgrounds */
    --ink:#1A1917;          /* Charcoal: headings, primary text */
    --ink-soft:#47433C;     /* darkened Charcoal tint: body text */
    --ink-faint:#6F6A60;    /* darkened Smoke: captions, taglines (readable on Bone) */
    --accent:#6B5B4A;       /* Burnt Umber: links, buttons, highlights */
    --accent-soft:#8A7762;  /* lighter Umber: hover */
    --smoke:#9B968C;        /* Smoke: borders, secondary elements */
    --line:#D8D0C0;         /* Sand: main dividers */
    --line-soft:#E6E0D4;    /* lighter Sand: hairlines */
    --max:920px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif; font-size:17px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);}
  a:hover{color:var(--accent-soft);}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 20px;}

  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(242,239,233,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .navbar{
    max-width:var(--max); margin:0 auto; padding:16px 20px 16px 0px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .navbar .name{
    font-family:'Fraunces', serif; font-size:34px; font-weight:600;
    text-decoration:none; color:var(--ink); cursor:pointer;
  }
  .navbar .brand{display:flex; flex-direction:column; align-items:flex-start;}
  .navbar .brand .name{line-height:1.1;}
  .navbar .brand .tagline{
    color:var(--ink-faint); font-size:15px; font-weight:500;
    margin-top:4px; line-height:1.3;
  }
  .navbar nav{display:flex; gap:20px;}
  .navbar nav a{color:var(--ink-soft); text-decoration:none; font-size:15px; cursor:pointer;}
  .navbar nav a:hover, .navbar nav a.active{color:var(--accent);}
  .navbar nav a[data-link="creative-intelligence"]{color:var(--accent); font-weight:500;}
  .navbar nav a[data-link="creative-intelligence"]:hover{color:var(--accent-soft);}
  .navbar .nav-toggle{display:none;}
  @media (max-width:640px){
    .navbar nav{
      position:absolute; top:100%; left:0; right:0; background:var(--paper);
      border-bottom:1px solid var(--line); flex-direction:column;
      padding:18px 28px; gap:16px; display:none;
    }
    .navbar nav.open{display:flex;}
    .navbar .nav-toggle{
      display:block; background:none; border:1px solid var(--smoke); border-radius:3px;
      padding:6px 10px; font-size:15px; color:var(--ink); cursor:pointer;
      font-family:'IBM Plex Sans',sans-serif;
    }
    .navbar .brand .tagline{font-size:12.5px;}
  }

  main#page-content{padding:58px 0 90px;}
  #loading{color:var(--ink-faint); padding:60px 0; text-align:center;}

  /* Hero layout (home page) */
  .page-hero .kicker{color:var(--accent); font-size:15px; font-weight:500; margin-bottom:18px;}
  .page-hero h1{
    font-family:'Fraunces', serif; font-weight:500; font-size:clamp(34px,5.4vw,54px);
    max-width:15ch; letter-spacing:-0.01em; line-height:1.15; margin:0 0 22px;
  }
  .page-hero p{font-size:19px; color:var(--ink-soft); max-width:56ch; margin:0 0 10px;}
  .page-hero p a{text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px; margin-right:4px;}

  /* Generic markdown prose styling for all other pages */
  .prose h1{
    font-family:'Fraunces', serif; font-weight:500; font-size:clamp(28px,4vw,40px);
    margin:0 0 26px; line-height:1.15;
  }
  .prose h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:24px;
    margin:42px 0 14px; padding-top:28px; border-top:1px solid var(--line);
  }
  .prose h2:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .prose h3{font-size:18px; font-weight:600; margin:22px 0 6px;}
  .prose p{margin:0 0 14px; color:var(--ink-soft); max-width:70ch;}
  .prose strong{color:var(--ink); font-weight:600;}
  .prose ul, .prose ol{margin:0 0 16px; padding-left:22px; color:var(--ink-soft); max-width:68ch;}
  .prose li{margin-bottom:6px;}
  .prose em{color:var(--ink-faint);}
  .prose hr{border:none; border-top:1px solid var(--smoke); opacity:0.5; margin:34px 0;}
  .prose table{border-collapse:collapse; width:100%; margin:10px 0 20px;}
  .prose th, .prose td{
    text-align:left; padding:10px 16px 10px 0; border-top:1px solid var(--line-soft); font-size:15px;
  }
  .prose th{color:var(--ink-faint); font-weight:500;}
  .prose td:first-child{color:var(--accent); font-weight:500;}
  .prose a{text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:1px;}

  /* "Label and text" layout: used by pages with "layout: sections" in their frontmatter.
     Each ## heading becomes a small label in the left column, its content sits beside it. */
  .prose .sec-row{
    display:grid; grid-template-columns:150px minmax(0,1fr); gap:6px 32px;
    padding:22px 0; border-top:1px solid var(--line);
  }
  .prose .sec-row h2{
    font-family:'IBM Plex Sans', sans-serif; font-size:14px; font-weight:400;
    color:var(--ink-faint); margin:0; padding:2px 0 0; border:none;
  }
  .prose .sec-body > :first-child{margin-top:0;}
  .prose .sec-body > :last-child{margin-bottom:0;}
  .prose .sec-body p{max-width:62ch;}
  @media (max-width:640px){
    .prose .sec-row{grid-template-columns:1fr; gap:8px;}
  }

  /* Images: sensible default, plus size/alignment utility classes for use in <img class="..."> */
  .prose img{
    max-width:100%; height:auto; display:block;
    margin:20px 0; border:1px solid var(--line);
  }
  .prose img.img-small{max-width:320px;}
  .prose img.img-medium{max-width:520px;}
  .prose img.img-full{max-width:100%;}
  .prose img.img-center{margin-left:auto; margin-right:auto;}
  .prose figure{margin:20px 0;}
  .prose figure img{margin:0 0 8px;}
  .prose figcaption{font-size:13.5px; color:var(--ink-faint); font-style:italic;}

  footer.site-footer{
    padding:40px 0; border-top:1px solid var(--smoke); background:var(--paper-alt);
    text-align:left;
  }
  footer.site-footer .fine{color:var(--ink-soft); font-size:13.5px;}
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <div class="brand">
      <a class="name" data-link="home">Inci Arici</a>
      <div class="tagline">Creative Operations · Production · Digital Transformation</div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">Menu</button>
    <nav id="navLinks"><!-- populated from manifest.json --></nav>
  </div>
</header>

<main id="page-content" class="wrap">
  <div id="loading">Loading…</div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="fine">Inci Arici — Amsterdam · <a href="mailto:incinema@gmail.com">incinema@gmail.com</a></div>
  </div>
</footer>

<a id="case-index-back-btn" href="javascript:void(0)" onclick="window.scrollTo({top:0, behavior:'smooth'})"
   style="position:fixed; bottom:24px; z-index:999; background:#1A1917; color:#F2EFE9; padding:10px 18px; border-radius:999px; font-size:13px; text-decoration:none; font-family:inherit; box-shadow:0 2px 10px rgba(26,25,23,0.25); display:none;">
  ↑ Index
</a>

<script>
(function(){
  var content = document.getElementById('page-content');
  var navLinks = document.getElementById('navLinks');
  var manifest = [];

  // Sticky "↑ Index" button visibility is driven by a per-page frontmatter flag
  // (indexButton: true) rather than any page-specific element ID, so any case
  // study page — Calvin Klein, Reebok, or future ones — can opt in the same way.
  function alignIndexButton(){
    var btn = document.getElementById('case-index-back-btn');
    if(content.dataset.hasIndex !== '1'){
      btn.style.display = 'none';
      return;
    }
    var paragraphs = content.querySelectorAll('.prose p');
    if(!paragraphs.length){
      btn.style.display = 'none';
      return;
    }
    var rightEdge = 0;
    paragraphs.forEach(function(p){
      var r = p.getBoundingClientRect();
      if(r.width > 0 && r.right > rightEdge) rightEdge = r.right;
    });
    var rightGap = window.innerWidth - rightEdge;
    btn.style.right = Math.max(rightGap, 12) + 'px';
    btn.style.display = 'block';
  }
  window.addEventListener('resize', alignIndexButton);

  // --- tiny frontmatter parser: pulls a --- ... --- block off the top of a markdown file ---
  function parseFrontmatter(raw){
    var meta = {};
    var body = raw;
    var match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    if(match){
      body = raw.slice(match[0].length);
      match[1].split('\n').forEach(function(line){
        var idx = line.indexOf(':');
        if(idx > -1){
          var key = line.slice(0, idx).trim();
          var val = line.slice(idx + 1).trim();
          meta[key] = val;
        }
      });
    }
    return { meta: meta, body: body };
  }

  // "Label and text" layout: wraps each <h2> and the content that follows it
  // into a two-column row. Anything before the first <h2> (like the <h1>) is left alone.
  function buildSections(prose){
    if(!prose) return;
    var kids = Array.prototype.slice.call(prose.children);
    var frag = document.createDocumentFragment();
    var body = null;
    kids.forEach(function(el){
      if(el.tagName === 'H2'){
        var row = document.createElement('div');
        row.className = 'sec-row';
        body = document.createElement('div');
        body.className = 'sec-body';
        row.appendChild(el);
        row.appendChild(body);
        frag.appendChild(row);
      } else if(body){
        body.appendChild(el);
      } else {
        frag.appendChild(el);
      }
    });
    prose.innerHTML = '';
    prose.appendChild(frag);
  }

  function setActiveNav(slug){
    navLinks.querySelectorAll('a').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-link') === slug);
    });
  }

  function renderPage(slug){
    var entry = manifest.find(function(p){ return p.slug === slug; });
    if(!entry){
      content.innerHTML = '<div class="prose"><h1>Page not found</h1><p>That page doesn\'t exist yet.</p></div>';
      content.dataset.hasIndex = '0';
      alignIndexButton();
      return;
    }
    content.innerHTML = '<div id="loading">Loading…</div>';
    content.dataset.hasIndex = '0';
    alignIndexButton();
    fetch('pages/' + entry.file, {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('Could not load ' + entry.file);
        return r.text();
      })
      .then(function(raw){
        var parsed = parseFrontmatter(raw);
        var html = marked.parse(parsed.body);
        var isHero = parsed.meta.layout === 'hero';
        var wrapClass = isHero ? 'page-hero' : 'prose';
        var kickerHtml = (isHero && parsed.meta.kicker) ? '<div class="kicker">' + parsed.meta.kicker + '</div>' : '';
        content.innerHTML = '<div class="' + wrapClass + '">' + kickerHtml + html + '</div>';
        if(parsed.meta.layout === 'sections'){
          buildSections(content.querySelector('.prose'));
        }
        content.dataset.hasIndex = (parsed.meta.indexButton === 'true') ? '1' : '0';
        document.title = (parsed.meta.title || entry.label) + ' — Inci Arici';
        setActiveNav(slug);
        window.scrollTo(0, 0);
        setTimeout(alignIndexButton, 100);
      })
      .catch(function(err){
        content.innerHTML = '<div class="prose"><h1>Something went wrong</h1><p>' + err.message + '</p></div>';
        content.dataset.hasIndex = '0';
        alignIndexButton();
      });
  }

  function currentSlug(){
    var hash = window.location.hash.replace(/^#\/?/, '');
    return hash || 'home';
  }

  function buildNav(){
    navLinks.innerHTML = '';
    manifest.filter(function(p){ return p.nav; }).forEach(function(p){
      var a = document.createElement('a');
      a.textContent = p.label;
      a.setAttribute('data-link', p.slug);
      a.href = '#/' + p.slug;
      navLinks.appendChild(a);
    });
  }

  window.addEventListener('hashchange', function(){ renderPage(currentSlug()); });

  document.querySelector('.name').addEventListener('click', function(){
    window.location.hash = '#/home';
  });

  var navToggle = document.getElementById('navToggle');
  navToggle.addEventListener('click', function(){ navLinks.classList.toggle('open'); });
  navLinks.addEventListener('click', function(e){
    if(e.target.tagName === 'A') navLinks.classList.remove('open');
  });

  fetch('pages/manifest.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      manifest = data;
      buildNav();
      renderPage(currentSlug());
    })
    .catch(function(err){
      content.innerHTML = '<div class="prose"><h1>Could not load site content</h1><p>' + err.message + '</p></div>';
    });
})();
</script>

</body>
</html>
