<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F2EFE9">
<title>Inci Arici — Creative Operations &amp; Production</title>
<meta name="description" content="Inci Arici — Creative Operations, Production &amp; Digital Transformation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* Warm Ash palette
     Charcoal #1A1917 · Bone #F2EFE9 · Sand #D8D0C0 · Smoke #9B968C · Burnt Umber #6B5B4A */
  :root{
    --paper:#F2EFE9;          /* Bone: page background */
    --paper-alt:#E8E3D9;      /* Bone, one step toward Sand: quiet panels */
    --ink:#1A1917;            /* Charcoal: text */
    --ink-soft:#3D3A35;       /* body copy */
    --ink-faint:#6F695F;      /* captions, labels (passes contrast on Bone) */
    --accent:#6B5B4A;         /* Burnt Umber: links */
    --accent-soft:#1A1917;    /* link hover goes to Charcoal */
    --line:#D8D0C0;           /* Sand: rules */
    --line-soft:#E2DCCE;
    --smoke:#9B968C;          /* Smoke: borders, secondary elements */
    --max:920px;
    --font:'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font); font-size:15px; line-height:1.55;
    letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);}
  a:hover{color:var(--accent-soft);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 20px;}

  /* ---------- Header: flat, quiet, no blur or border ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:var(--paper);
  }
  .navbar{
    max-width:var(--max); margin:0 auto; padding:22px 20px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:24px;
  }
  .navbar .name{
    font-family:var(--font); font-size:15px; font-weight:600; letter-spacing:-0.01em;
    text-decoration:none; color:var(--ink); cursor:pointer;
  }
  .navbar .brand{display:flex; flex-direction:column; align-items:flex-start;}
  .navbar .brand .name{line-height:1.2;}
  .navbar .brand .tagline{
    color:var(--ink-faint); font-size:13px; font-weight:400;
    margin-top:2px; line-height:1.3;
  }
  .navbar nav{display:flex; gap:22px;}
  .navbar nav a{
    color:var(--ink-faint); text-decoration:none; font-size:14px; cursor:pointer;
    transition:color .15s ease;
  }
  .navbar nav a:hover, .navbar nav a.active{color:var(--ink);}
  .navbar nav a.active{text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1px;}
  .navbar nav a[data-link="creative-intelligence"]{color:var(--accent);}
  .navbar nav a[data-link="creative-intelligence"]:hover{color:var(--ink);}
  .navbar .nav-toggle{display:none;}
  @media (max-width:640px){
    .navbar nav{
      position:absolute; top:100%; left:0; right:0; background:var(--paper);
      border-bottom:1px solid var(--line); flex-direction:column;
      padding:8px 20px 20px; gap:14px; display:none;
    }
    .navbar nav.open{display:flex;}
    .navbar .nav-toggle{
      display:block; background:none; border:none; border-bottom:1px solid var(--smoke); border-radius:0;
      padding:2px 0; font-size:14px; color:var(--ink); cursor:pointer;
      font-family:var(--font);
    }
    .navbar .brand .tagline{font-size:12.5px;}
  }

  main#page-content{padding:72px 0 120px;}
  #loading{color:var(--ink-faint); padding:60px 0; text-align:left;}

  /* ---------- Hero (home page): large type, lots of air ---------- */
  .page-hero .kicker{color:var(--ink-faint); font-size:14px; font-weight:400; margin-bottom:28px;}
  .page-hero h1{
    font-family:var(--font); font-weight:500; font-size:clamp(36px,6.4vw,68px);
    max-width:16ch; letter-spacing:-0.035em; line-height:1.04; margin:0 0 36px;
  }
  .page-hero p{font-size:17px; color:var(--ink-soft); max-width:52ch; margin:0 0 12px; line-height:1.5;}
  .page-hero p a{text-decoration:none; border-bottom:1px solid var(--smoke); padding-bottom:1px; margin-right:6px; color:var(--ink);}
  .page-hero p a:hover{border-bottom-color:var(--ink);}

  /* ---------- Prose: used by every other page ---------- */
  .prose h1{
    font-family:var(--font); font-weight:500; font-size:clamp(30px,4.6vw,48px);
    letter-spacing:-0.03em; margin:0 0 40px; line-height:1.08;
  }
  .prose h2{
    font-family:var(--font); font-weight:500; font-size:21px; letter-spacing:-0.02em;
    margin:56px 0 14px; padding-top:24px; border-top:1px solid var(--line);
  }
  .prose h2:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .prose h3{font-size:15px; font-weight:600; margin:28px 0 6px; letter-spacing:-0.01em;}
  .prose p{margin:0 0 14px; color:var(--ink-soft); max-width:68ch;}
  .prose strong{color:var(--ink); font-weight:600;}
  .prose ul, .prose ol{margin:0 0 16px; padding-left:20px; color:var(--ink-soft); max-width:66ch;}
  .prose li{margin-bottom:6px;}
  .prose em{color:var(--ink-faint);}
  .prose hr{border:none; border-top:1px solid var(--line); margin:44px 0;}
  .prose table{border-collapse:collapse; width:100%; margin:10px 0 24px;}
  .prose th, .prose td{
    text-align:left; padding:10px 16px 10px 0; border-top:1px solid var(--line); font-size:14px;
  }
  .prose th{color:var(--ink-faint); font-weight:400;}
  .prose td:first-child{color:var(--ink); font-weight:500;}
  .prose a{text-decoration:none; border-bottom:1px solid var(--smoke); padding-bottom:1px;}
  .prose a:hover{border-bottom-color:var(--ink);}

  /* "Label and text" layout (pages with "layout: sections" in frontmatter):
     each ## heading is a small label in the left column, its content beside it. */
  .prose .sec-row{
    display:grid; grid-template-columns:150px minmax(0,1fr); gap:6px 32px;
    padding:24px 0; border-top:1px solid var(--line);
  }
  .prose .sec-row h2{
    font-family:var(--font); font-size:14px; font-weight:400; letter-spacing:0;
    color:var(--ink-faint); margin:0; padding:2px 0 0; border:none;
  }
  .prose .sec-body > :first-child{margin-top:0;}
  .prose .sec-body > :last-child{margin-bottom:0;}
  .prose .sec-body p{max-width:62ch;}
  @media (max-width:640px){
    .prose .sec-row{grid-template-columns:1fr; gap:8px;}
  }

  /* ---------- Images: borderless and square-cornered, let the work lead ---------- */
  .prose img{
    max-width:100%; height:auto; display:block;
    margin:28px 0; border:none; border-radius:0;
  }
  .prose img.img-small{max-width:320px;}
  .prose img.img-medium{max-width:520px;}
  .prose img.img-full{max-width:100%;}
  .prose img.img-center{margin-left:auto; margin-right:auto;}
  .prose figure{margin:28px 0;}
  .prose figure img{margin:0 0 10px;}
  .prose figcaption{font-size:13px; color:var(--ink-faint); font-style:normal;}

  /* ---------- Footer ---------- */
  footer.site-footer{
    padding:32px 0 40px; border-top:1px solid var(--line); background:var(--paper);
    text-align:left;
  }
  footer.site-footer .fine{color:var(--ink-faint); font-size:13px;}
  footer.site-footer a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--smoke);}
  footer.site-footer a:hover{border-bottom-color:var(--ink);}

  /* Back-to-index button (shown only on pages that opt in) */
  #case-index-back-btn{
    background:var(--ink) !important; color:var(--paper) !important;
    border-radius:0 !important; font-size:13px !important; padding:9px 14px !important;
    box-shadow:none !important;
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <div class="brand">
      <a class="name" data-link="home">Inci Arici</a>
      <div class="tagline">Creative Operations · Production · Digital Transformation</div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">Menu</button>
    <nav id="navLinks"><!-- populated from manifest.json --></nav>
  </div>
</header>

<main id="page-content" class="wrap">
  <div id="loading">Loading…</div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="fine">Inci Arici — Amsterdam · <a href="mailto:incinema@gmail.com">incinema@gmail.com</a></div>
  </div>
</footer>

<a id="case-index-back-btn" href="javascript:void(0)" onclick="window.scrollTo({top:0, behavior:'smooth'})"
   style="position:fixed; bottom:24px; z-index:999; background:#1A1917; color:#F2EFE9; padding:10px 18px; border-radius:0; font-size:13px; text-decoration:none; font-family:inherit; display:none;">
  ↑ Index
</a>

<script>
(function(){
  var content = document.getElementById('page-content');
  var navLinks = document.getElementById('navLinks');
  var manifest = [];

  // Sticky "↑ Index" button visibility is driven by a per-page frontmatter flag
  // (indexButton: true) rather than any page-specific element ID, so any case
  // study page — Calvin Klein, Reebok, or future ones — can opt in the same way.
  function alignIndexButton(){
    var btn = document.getElementById('case-index-back-btn');
    if(content.dataset.hasIndex !== '1'){
      btn.style.display = 'none';
      return;
    }
    var paragraphs = content.querySelectorAll('.prose p');
    if(!paragraphs.length){
      btn.style.display = 'none';
      return;
    }
    var rightEdge = 0;
    paragraphs.forEach(function(p){
      var r = p.getBoundingClientRect();
      if(r.width > 0 && r.right > rightEdge) rightEdge = r.right;
    });
    var rightGap = window.innerWidth - rightEdge;
    btn.style.right = Math.max(rightGap, 12) + 'px';
    btn.style.display = 'block';
  }
  window.addEventListener('resize', alignIndexButton);

  // --- tiny frontmatter parser: pulls a --- ... --- block off the top of a markdown file ---
  function parseFrontmatter(raw){
    var meta = {};
    var body = raw;
    var match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    if(match){
      body = raw.slice(match[0].length);
      match[1].split('\n').forEach(function(line){
        var idx = line.indexOf(':');
        if(idx > -1){
          var key = line.slice(0, idx).trim();
          var val = line.slice(idx + 1).trim();
          meta[key] = val;
        }
      });
    }
    return { meta: meta, body: body };
  }

  // "Label and text" layout: wraps each <h2> and the content that follows it
  // into a two-column row. Anything before the first <h2> (like the <h1>) is left alone.
  function buildSections(prose){
    if(!prose) return;
    var kids = Array.prototype.slice.call(prose.children);
    var frag = document.createDocumentFragment();
    var body = null;
    kids.forEach(function(el){
      if(el.tagName === 'H2'){
        var row = document.createElement('div');
        row.className = 'sec-row';
        body = document.createElement('div');
        body.className = 'sec-body';
        row.appendChild(el);
        row.appendChild(body);
        frag.appendChild(row);
      } else if(body){
        body.appendChild(el);
      } else {
        frag.appendChild(el);
      }
    });
    prose.innerHTML = '';
    prose.appendChild(frag);
  }

  function setActiveNav(slug){
    navLinks.querySelectorAll('a').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-link') === slug);
    });
  }

  function renderPage(slug){
    var entry = manifest.find(function(p){ return p.slug === slug; });
    if(!entry){
      content.innerHTML = '<div class="prose"><h1>Page not found</h1><p>That page doesn\'t exist yet.</p></div>';
      content.dataset.hasIndex = '0';
      alignIndexButton();
      return;
    }
    content.innerHTML = '<div id="loading">Loading…</div>';
    content.dataset.hasIndex = '0';
    alignIndexButton();
    fetch('pages/' + entry.file, {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('Could not load ' + entry.file);
        return r.text();
      })
      .then(function(raw){
        var parsed = parseFrontmatter(raw);
        var html = marked.parse(parsed.body);
        var isHero = parsed.meta.layout === 'hero';
        var wrapClass = isHero ? 'page-hero' : 'prose';
        var kickerHtml = (isHero && parsed.meta.kicker) ? '<div class="kicker">' + parsed.meta.kicker + '</div>' : '';
        content.innerHTML = '<div class="' + wrapClass + '">' + kickerHtml + html + '</div>';
        if(parsed.meta.layout === 'sections'){
          buildSections(content.querySelector('.prose'));
        }
        content.dataset.hasIndex = (parsed.meta.indexButton === 'true') ? '1' : '0';
        document.title = (parsed.meta.title || entry.label) + ' — Inci Arici';
        setActiveNav(slug);
        window.scrollTo(0, 0);
        setTimeout(alignIndexButton, 100);
      })
      .catch(function(err){
        content.innerHTML = '<div class="prose"><h1>Something went wrong</h1><p>' + err.message + '</p></div>';
        content.dataset.hasIndex = '0';
        alignIndexButton();
      });
  }

  function currentSlug(){
    var hash = window.location.hash.replace(/^#\/?/, '');
    return hash || 'home';
  }

  function buildNav(){
    navLinks.innerHTML = '';
    manifest.filter(function(p){ return p.nav; }).forEach(function(p){
      var a = document.createElement('a');
      a.textContent = p.label;
      a.setAttribute('data-link', p.slug);
      a.href = '#/' + p.slug;
      navLinks.appendChild(a);
    });
  }

  window.addEventListener('hashchange', function(){ renderPage(currentSlug()); });

  document.querySelector('.name').addEventListener('click', function(){
    window.location.hash = '#/home';
  });

  var navToggle = document.getElementById('navToggle');
  navToggle.addEventListener('click', function(){ navLinks.classList.toggle('open'); });
  navLinks.addEventListener('click', function(e){
    if(e.target.tagName === 'A') navLinks.classList.remove('open');
  });

  fetch('pages/manifest.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      manifest = data;
      buildNav();
      renderPage(currentSlug());
    })
    .catch(function(err){
      content.innerHTML = '<div class="prose"><h1>Could not load site content</h1><p>' + err.message + '</p></div>';
    });
})();
</script>

</body>
</html>
