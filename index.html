<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Inci Arici — Creative Operations &amp; Production</title>
<meta name="description" content="Inci Arici — Creative Operations, Production &amp; Digital Transformation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* Style reference: KIKK Festival talk page.
     White page · near-black ink · mid-grey body · hairline rules.
     Poppins Light for reading text, heavy tight uppercase grotesk for headlines,
     small wide-tracked uppercase for labels, outlined boxes, notched black buttons.
     Fonts were matched by eye from a screenshot (Poppins + Inter Tight are the closest Google Fonts). */
  :root{
    --paper:#FFFFFF;          /* page background */
    --paper-alt:#F5F5F5;      /* quiet panels / image placeholders */
    --ink:#111111;            /* headlines, links, buttons */
    --ink-soft:#5F5F5F;       /* body copy (light grey, like the reference) */
    --ink-faint:#6B6B6B;      /* labels, captions, meta */
    --accent:#111111;         /* monochrome: links stay ink */
    --accent-soft:#111111;
    --line:#DADADA;           /* hairline rules and outlines */
    --line-soft:#E8E8E8;
    --smoke:#B5B5B5;          /* underline hairlines */
    --max:1440px;
    --pad:clamp(20px,3vw,56px);
    --notch:10px;             /* clipped corner on black buttons */
    --font:'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-display:'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font); font-weight:300; font-size:16px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--ink);}
  a:hover{color:var(--ink-faint);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 var(--pad);}

  /* ---------- Header: white, bordered nav box, notched black active state ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:var(--paper);
  }
  .navbar{
    max-width:var(--max); margin:0 auto; padding:18px var(--pad);
    display:flex; justify-content:space-between; align-items:center; gap:24px;
  }
  .navbar .name{
    font-family:var(--font-display); font-size:15px; font-weight:800; letter-spacing:0.02em;
    text-transform:uppercase; text-decoration:none; color:var(--ink); cursor:pointer;
  }
  .navbar .brand{display:flex; flex-direction:column; align-items:flex-start;}
  .navbar .brand .name{line-height:1.2;}
  .navbar .brand .tagline{
    color:var(--ink-faint); font-size:10.5px; font-weight:400; text-transform:uppercase;
    letter-spacing:0.18em; margin-top:5px; line-height:1.4;
  }
  .navbar nav{display:flex; gap:0; border:1px solid var(--line);}
  .navbar nav a{
    color:var(--ink-faint); text-decoration:none; cursor:pointer;
    font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.14em;
    padding:17px 22px; line-height:1;
    transition:color .15s ease, background-color .15s ease;
  }
  .navbar nav a:hover{color:var(--ink);}
  .navbar nav a.active{
    background:var(--ink); color:var(--paper); font-weight:600;
    clip-path:polygon(0 0, calc(100% - var(--notch)) 0, 100% var(--notch), 100% 100%, 0 100%);
  }
  .navbar nav a[data-link="creative-intelligence"]{color:var(--ink);}
  .navbar nav a[data-link="creative-intelligence"].active{color:var(--paper);}
  .navbar .nav-toggle{display:none;}
  @media (max-width:760px){
    .navbar nav{
      position:absolute; top:100%; left:0; right:0; background:var(--paper);
      border:none; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
      flex-direction:column; padding:8px var(--pad) 20px; gap:0; display:none;
    }
    .navbar nav.open{display:flex;}
    .navbar nav a{padding:14px 0; border-bottom:1px solid var(--line-soft);}
    .navbar nav a.active{background:none; color:var(--ink); clip-path:none;}
    .navbar .nav-toggle{
      display:block; background:var(--paper); border:1px solid var(--line); border-radius:0;
      padding:14px 18px; font-size:12px; font-weight:500; text-transform:uppercase;
      letter-spacing:0.14em; color:var(--ink); cursor:pointer; font-family:var(--font);
    }
    .navbar .brand .tagline{font-size:9.5px; letter-spacing:0.14em;}
  }

  main#page-content{padding:56px var(--pad) 120px;}
  #loading{color:var(--ink-faint); padding:60px 0; text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:0.2em;}

  /* ---------- Hero (home page): huge, heavy, tightly tracked ---------- */
  .page-hero .kicker{
    color:var(--ink-faint); font-size:14px; font-weight:400; text-transform:uppercase;
    letter-spacing:0.2em; margin-bottom:18px;
  }
  .page-hero h1{
    font-family:var(--font-display); font-weight:800; text-transform:uppercase;
    font-size:clamp(38px,7.2vw,104px); max-width:18ch;
    letter-spacing:-0.045em; line-height:0.95; margin:0 0 48px;
  }
  .page-hero p{font-size:18px; color:var(--ink-soft); max-width:56ch; margin:0 0 14px; line-height:1.7;}
  .page-hero p a{text-decoration:none; border-bottom:1px solid var(--smoke); padding-bottom:1px; margin-right:6px; color:var(--ink); font-weight:400;}
  .page-hero p a:hover{border-bottom-color:var(--ink); color:var(--ink);}

  /* ---------- Prose: used by every other page ---------- */
  .prose h1{
    font-family:var(--font-display); font-weight:800; text-transform:uppercase;
    font-size:clamp(30px,5.6vw,80px); max-width:20ch;
    letter-spacing:-0.045em; margin:0 0 48px; line-height:0.97;
  }
  .prose h2{
    font-family:var(--font-display); font-weight:800; text-transform:uppercase;
    font-size:clamp(20px,2.2vw,28px); letter-spacing:-0.02em; line-height:1.1;
    margin:64px 0 18px; padding-top:28px; border-top:1px solid var(--line);
  }
  .prose h2:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .prose h3{
    font-family:var(--font); font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.2em; color:var(--ink); margin:32px 0 8px;
  }
  .prose p{margin:0 0 18px; color:var(--ink-soft); max-width:70ch; font-weight:300;}
  .prose strong{color:var(--ink); font-weight:500;}
  .prose ul, .prose ol{margin:0 0 20px; padding-left:20px; color:var(--ink-soft); max-width:68ch;}
  .prose li{margin-bottom:8px;}
  .prose em{color:var(--ink-faint);}
  .prose hr{border:none; border-top:1px solid var(--line); margin:56px 0;}
  .prose table{border-collapse:collapse; width:100%; margin:12px 0 28px;}
  .prose th, .prose td{
    text-align:left; padding:14px 20px 14px 0; border-top:1px solid var(--line); font-size:14px;
  }
  .prose th{
    color:var(--ink-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.2em;
  }
  .prose td{color:var(--ink-soft);}
  .prose td:first-child{color:var(--ink); font-weight:500;}
  .prose a{text-decoration:none; border-bottom:1px solid var(--smoke); padding-bottom:1px; font-weight:400;}
  .prose a:hover{border-bottom-color:var(--ink); color:var(--ink);}

  /* "Label and text" layout (pages with "layout: sections" in frontmatter):
     each ## heading is a small bold tracked label in the left column, its content
     starts roughly a quarter of the way across, as on the reference page. */
  .prose .sec-row{
    display:grid; grid-template-columns:27% minmax(0,1fr); gap:8px 0;
    padding:44px 0; border-top:1px solid var(--line);
  }
  .prose .sec-row h2{
    font-family:var(--font); font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.3em; line-height:1.4;
    color:var(--ink-faint); margin:0; padding:6px 0 0; border:none;
  }
  .prose .sec-body > :first-child{margin-top:0;}
  .prose .sec-body > :last-child{margin-bottom:0;}
  .prose .sec-body p{max-width:64ch;}
  @media (max-width:760px){
    .prose .sec-row{grid-template-columns:1fr; gap:14px; padding:32px 0;}
  }

  /* ---------- Images: square, borderless, on a pale panel while loading ---------- */
  .prose img{
    max-width:100%; height:auto; display:block;
    margin:32px 0; border:none; border-radius:0; background:var(--paper-alt);
  }
  .prose img.img-small{max-width:320px;}
  .prose img.img-medium{max-width:520px;}
  .prose img.img-full{max-width:100%;}
  .prose img.img-center{margin-left:auto; margin-right:auto;}
  .prose figure{margin:32px 0;}
  .prose figure img{margin:0 0 12px;}
  .prose figcaption{
    font-size:11px; color:var(--ink-faint); font-style:normal; font-weight:500;
    text-transform:uppercase; letter-spacing:0.16em;
  }

  /* ---------- Footer ---------- */
  footer.site-footer{
    padding:36px 0 44px; border-top:1px solid var(--line); background:var(--paper);
    text-align:left;
  }
  footer.site-footer .fine{
    color:var(--ink-faint); font-size:12px; font-weight:400;
    text-transform:uppercase; letter-spacing:0.16em;
  }
  footer.site-footer a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--smoke);}
  footer.site-footer a:hover{border-bottom-color:var(--ink);}

  /* Back-to-index button (shown only on pages that opt in): black, notched corner */
  #case-index-back-btn{
    background:var(--ink) !important; color:var(--paper) !important;
    border-radius:0 !important; font-size:12px !important; font-weight:600 !important;
    text-transform:uppercase; letter-spacing:0.14em;
    padding:14px 22px !important; box-shadow:none !important;
    clip-path:polygon(0 0, calc(100% - var(--notch)) 0, 100% var(--notch), 100% 100%, 0 100%);
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <div class="brand">
      <a class="name" data-link="home">Inci Arici</a>
      <div class="tagline">Creative Operations · Production · Digital Transformation</div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">Menu</button>
    <nav id="navLinks"><!-- populated from manifest.json --></nav>
  </div>
</header>

<main id="page-content" class="wrap">
  <div id="loading">Loading…</div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="fine">Inci Arici — Amsterdam · <a href="mailto:incinema@gmail.com">incinema@gmail.com</a></div>
  </div>
</footer>

<a id="case-index-back-btn" href="javascript:void(0)" onclick="window.scrollTo({top:0, behavior:'smooth'})"
   style="position:fixed; bottom:24px; z-index:999; background:#111111; color:#FFFFFF; padding:10px 18px; border-radius:0; font-size:13px; text-decoration:none; font-family:inherit; display:none;">
  ↑ Index
</a>

<script>
(function(){
  var content = document.getElementById('page-content');
  var navLinks = document.getElementById('navLinks');
  var manifest = [];

  // Sticky "↑ Index" button visibility is driven by a per-page frontmatter flag
  // (indexButton: true) rather than any page-specific element ID, so any case
  // study page — Calvin Klein, Reebok, or future ones — can opt in the same way.
  function alignIndexButton(){
    var btn = document.getElementById('case-index-back-btn');
    if(content.dataset.hasIndex !== '1'){
      btn.style.display = 'none';
      return;
    }
    var paragraphs = content.querySelectorAll('.prose p');
    if(!paragraphs.length){
      btn.style.display = 'none';
      return;
    }
    var rightEdge = 0;
    paragraphs.forEach(function(p){
      var r = p.getBoundingClientRect();
      if(r.width > 0 && r.right > rightEdge) rightEdge = r.right;
    });
    var rightGap = window.innerWidth - rightEdge;
    btn.style.right = Math.max(rightGap, 12) + 'px';
    btn.style.display = 'block';
  }
  window.addEventListener('resize', alignIndexButton);

  // --- tiny frontmatter parser: pulls a --- ... --- block off the top of a markdown file ---
  function parseFrontmatter(raw){
    var meta = {};
    var body = raw;
    var match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    if(match){
      body = raw.slice(match[0].length);
      match[1].split('\n').forEach(function(line){
        var idx = line.indexOf(':');
        if(idx > -1){
          var key = line.slice(0, idx).trim();
          var val = line.slice(idx + 1).trim();
          meta[key] = val;
        }
      });
    }
    return { meta: meta, body: body };
  }

  // "Label and text" layout: wraps each <h2> and the content that follows it
  // into a two-column row. Anything before the first <h2> (like the <h1>) is left alone.
  function buildSections(prose){
    if(!prose) return;
    var kids = Array.prototype.slice.call(prose.children);
    var frag = document.createDocumentFragment();
    var body = null;
    kids.forEach(function(el){
      if(el.tagName === 'H2'){
        var row = document.createElement('div');
        row.className = 'sec-row';
        body = document.createElement('div');
        body.className = 'sec-body';
        row.appendChild(el);
        row.appendChild(body);
        frag.appendChild(row);
      } else if(body){
        body.appendChild(el);
      } else {
        frag.appendChild(el);
      }
    });
    prose.innerHTML = '';
    prose.appendChild(frag);
  }

  function setActiveNav(slug){
    navLinks.querySelectorAll('a').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-link') === slug);
    });
  }

  function renderPage(slug){
    var entry = manifest.find(function(p){ return p.slug === slug; });
    if(!entry){
      content.innerHTML = '<div class="prose"><h1>Page not found</h1><p>That page doesn\'t exist yet.</p></div>';
      content.dataset.hasIndex = '0';
      alignIndexButton();
      return;
    }
    content.innerHTML = '<div id="loading">Loading…</div>';
    content.dataset.hasIndex = '0';
    alignIndexButton();
    fetch('pages/' + entry.file, {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('Could not load ' + entry.file);
        return r.text();
      })
      .then(function(raw){
        var parsed = parseFrontmatter(raw);
        var html = marked.parse(parsed.body);
        var isHero = parsed.meta.layout === 'hero';
        var wrapClass = isHero ? 'page-hero' : 'prose';
        var kickerHtml = (isHero && parsed.meta.kicker) ? '<div class="kicker">' + parsed.meta.kicker + '</div>' : '';
        content.innerHTML = '<div class="' + wrapClass + '">' + kickerHtml + html + '</div>';
        if(parsed.meta.layout === 'sections'){
          buildSections(content.querySelector('.prose'));
        }
        content.dataset.hasIndex = (parsed.meta.indexButton === 'true') ? '1' : '0';
        document.title = (parsed.meta.title || entry.label) + ' — Inci Arici';
        setActiveNav(slug);
        window.scrollTo(0, 0);
        setTimeout(alignIndexButton, 100);
      })
      .catch(function(err){
        content.innerHTML = '<div class="prose"><h1>Something went wrong</h1><p>' + err.message + '</p></div>';
        content.dataset.hasIndex = '0';
        alignIndexButton();
      });
  }

  function currentSlug(){
    var hash = window.location.hash.replace(/^#\/?/, '');
    return hash || 'home';
  }

  function buildNav(){
    navLinks.innerHTML = '';
    manifest.filter(function(p){ return p.nav; }).forEach(function(p){
      var a = document.createElement('a');
      a.textContent = p.label;
      a.setAttribute('data-link', p.slug);
      a.href = '#/' + p.slug;
      navLinks.appendChild(a);
    });
  }

  window.addEventListener('hashchange', function(){ renderPage(currentSlug()); });

  document.querySelector('.name').addEventListener('click', function(){
    window.location.hash = '#/home';
  });

  var navToggle = document.getElementById('navToggle');
  navToggle.addEventListener('click', function(){ navLinks.classList.toggle('open'); });
  navLinks.addEventListener('click', function(e){
    if(e.target.tagName === 'A') navLinks.classList.remove('open');
  });

  fetch('pages/manifest.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      manifest = data;
      buildNav();
      renderPage(currentSlug());
    })
    .catch(function(err){
      content.innerHTML = '<div class="prose"><h1>Could not load site content</h1><p>' + err.message + '</p></div>';
    });
})();
</script>

</body>
</html>
